{% extends "pantry/base.html" %}

{% block title %}{{ heading }} | PantryPal{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <h1 class="page-title mb-3">{{ heading }}</h1>
    <form method="post" novalidate class="form-panel">
      {% csrf_token %}
      {% for field in form %}
        <div class="mb-3">
          <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {% for error in field.errors %}
            <div class="text-danger small mt-1">{{ error }}</div>
          {% endfor %}
        </div>
      {% endfor %}
      <div class="d-flex gap-2">
        <button class="btn btn-ink" type="submit">Save item</button>
        <a class="btn btn-outline-secondary" href="{% url 'pantry:list' %}">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
